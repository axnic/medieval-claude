description = "Motus paysan : coupe/réactive tout, une catégorie précise, ou affiche l'état (session.start, task.complete, task.error, input.required, resource.limit, user.spam)"
argument-hint = "[catégorie|liste]"
prompt = "Exécute cette commande shell exacte via l'outil Bash puis rapporte toute sa sortie, sans rien ajouter :\n\nDIR=\"${CLAUDE_CONFIG_DIR:-$HOME/.claude}\"; mkdir -p \"$DIR\"; F=\"$DIR/.paysan-sound-muted\"; D=\"$DIR/.paysan-sound-disabled\"; touch \"$D\"; A=\"{{args}}\"; CATS=\"session.start task.complete task.error input.required resource.limit user.spam\"; case \"$A\" in '') if [ -e \"$F\" ]; then rm \"$F\"; echo \"Motus général levé : le paysan cause derechef.\"; else touch \"$F\"; echo \"Motus général : silence complet du paysan.\"; fi ;; liste|statut) if [ -e \"$F\" ]; then echo \"Motus général : ACTIF (tout est coupé).\"; else echo \"Motus général : inactif.\"; fi; for c in $CATS; do if grep -qxF \"$c\" \"$D\"; then echo \"  $c : coupé\"; else echo \"  $c : actif\"; fi; done ;; *) V=0; for c in $CATS; do [ \"$A\" = \"$c\" ] && V=1; done; if [ \"$V\" -eq 0 ]; then echo \"Catégorie inconnue : $A (valides : $CATS, ou 'liste')\"; else if grep -qxF \"$A\" \"$D\"; then grep -vxF \"$A\" \"$D\" > \"$D.tmp\"; mv \"$D.tmp\" \"$D\"; echo \"Catégorie '$A' réactivée.\"; else echo \"$A\" >> \"$D\"; echo \"Catégorie '$A' coupée.\"; fi; fi ;; esac"
