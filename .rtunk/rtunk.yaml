# Configuration of rtunk for this repository (trunk.yaml format).
---
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      # renovate: datasource=github-tags depName=trunk-io/plugins
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
lint:
  enabled:
    # renovate: datasource=github-releases depName=rhysd/actionlint
    - actionlint@1.7.7
    - git-diff-check
    # renovate: datasource=npm depName=markdownlint-cli
    - markdownlint@0.49.1
    # renovate: datasource=npm depName=prettier
    - prettier@3.9.6
    # renovate: datasource=github-releases depName=tamasfe/taplo
    - taplo@0.10.0
    # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
    - trufflehog@3.97.4
    # renovate: datasource=pypi depName=yamllint
    - yamllint@1.38.0
